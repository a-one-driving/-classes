<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A1 Attendance | Driving Classes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080808;
  --surface:#111;
  --surface2:#151515;
  --border:#252525;
  --gold:#d7b36a;
  --gold-light:#f0d18b;
  --text:#f5f5f5;
  --muted:#858585;
  --green:#55d996;
  --blue:#70b4ff;
  --red:#ff7777;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(215,179,106,.10),
      transparent 35%
    ),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:88px;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(8,8,8,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #1f1f1f;
}

.headerInner{
  max-width:900px;
  margin:auto;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  border:1px solid #6b5835;
  background:#0d0d0d;
  color:var(--gold-light);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:800;
}

.brandTitle{
  font-size:15px;
  font-weight:800;
}

.brandSub{
  color:#666;
  font-size:8px;
  letter-spacing:1.5px;
  margin-top:4px;
}

.clock{
  text-align:right;
}

.clockTime{
  color:var(--gold-light);
  font-size:13px;
  font-weight:700;
}

.clockDate{
  color:#666;
  font-size:8px;
  margin-top:4px;
}

/* ================= MAIN ================= */

.container{
  max-width:900px;
  margin:auto;
  padding:18px 16px 30px;
}

/* SEARCH */

.search{
  position:relative;
  margin-bottom:18px;
}

.searchIcon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#666;
  font-size:17px;
}

.search input{
  width:100%;
  height:48px;
  padding:0 15px 0 42px;
  border-radius:14px;
  border:1px solid var(--border);
  background:#101010;
  color:white;
  outline:none;
  font-size:12px;
}

.search input:focus{
  border-color:#665331;
}

.search input::placeholder{
  color:#555;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:22px;
}

.stat{
  min-height:72px;
  padding:12px 7px;
  border-radius:14px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,#141414,#0e0e0e);
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.statValue{
  color:var(--gold-light);
  font-size:20px;
  line-height:1;
  font-weight:800;
}

.statLabel{
  color:#666;
  font-size:7px;
  letter-spacing:1px;
  margin-top:7px;
}

/* ================= SECTION ================= */

.sectionHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:11px;
  padding:0 2px;
}

.sectionTitle{
  font-size:13px;
  font-weight:700;
}

.sectionCount{
  color:#666;
  font-size:9px;
}

/* ================= CARDS ================= */

.cards{
  display:grid;
  gap:10px;
}

.studentCard{
  position:relative;
  padding:15px;
  border:1px solid var(--border);
  border-radius:17px;
  background:#111;
  transition:border-color .2s,transform .2s;
}

.studentCard:hover{
  border-color:#353535;
}

.studentCard.inactive{
  background:#0d0d0d;
  border-color:#202020;
  opacity:.72;
}

.studentHeader{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:43px;
  height:43px;
  flex:none;
  border-radius:13px;
  background:#17130c;
  border:1px solid #4c3e25;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold-light);
  font-size:15px;
  font-weight:800;
}

.studentInfo{
  min-width:0;
  flex:1;
}

.studentName{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.studentPhone{
  color:#666;
  font-size:9px;
  margin-top:4px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:5px;
}

.badge{
  padding:5px 7px;
  border-radius:7px;
  font-size:7px;
  font-weight:800;
  letter-spacing:.5px;
  white-space:nowrap;
}

.badge.active{
  color:var(--green);
  background:rgba(85,217,150,.07);
  border:1px solid rgba(85,217,150,.18);
}

.badge.live{
  color:#78c8ff;
  background:rgba(120,200,255,.07);
  border:1px solid rgba(120,200,255,.18);
}

.badge.completed{
  color:var(--gold-light);
  background:rgba(215,179,106,.07);
  border:1px solid rgba(215,179,106,.20);
}

.badge.inactive{
  color:#999;
  background:#171717;
  border:1px solid #2c2c2c;
}

/* CLASS TYPE */

.typeRow{
  margin-top:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 11px;
  background:#0c0c0c;
  border:1px solid #202020;
  border-radius:10px;
}

.typeInfo{
  display:flex;
  align-items:center;
  gap:8px;
}

.typeLabel{
  color:#666;
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.typeValue{
  color:var(--gold-light);
  font-size:10px;
  font-weight:800;
}

.editType{
  border:1px solid #3a3224;
  background:#16130e;
  color:var(--gold-light);
  border-radius:8px;
  padding:6px 9px;
  font-size:8px;
  font-weight:700;
}

/* LAST ATTENDANCE */

.lastAttendance{
  margin-top:9px;
  padding:10px 11px;
  border-radius:10px;
  background:#0c0c0c;
  border:1px solid #1e1e1e;
}

.lastLabel{
  color:#5e5e5e;
  font-size:7px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.lastText{
  color:#c8c8c8;
  font-size:9px;
  line-height:1.5;
  margin-top:5px;
}

/* PROGRESS */

.progressBox{
  margin-top:12px;
}

.progressTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:6px;
}

.progressLabel{
  color:#666;
  font-size:7px;
  letter-spacing:1px;
}

.progressCount{
  color:#aaa;
  font-size:8px;
  font-weight:700;
}

.progress{
  height:5px;
  width:100%;
  border-radius:10px;
  background:#222;
  overflow:hidden;
}

.progressBar{
  height:100%;
  border-radius:10px;
  background:linear-gradient(
    90deg,
    var(--gold),
    var(--gold-light)
  );
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:1.25fr 1fr 1fr 1fr;
  gap:6px;
  margin-top:12px;
}

.action{
  min-height:36px;
  border:1px solid #282828;
  border-radius:9px;
  background:#151515;
  color:#bdbdbd;
  font-size:8px;
  font-weight:700;
}

.action.attend{
  background:linear-gradient(
    135deg,
    var(--gold-light),
    var(--gold)
  );
  color:#111;
  border:none;
}

.action.wa{
  color:#72dfa0;
}

.action.call{
  color:#7eb9ff;
}

.notActiveBtn{
  width:100%;
  margin-top:7px;
  min-height:35px;
  border-radius:9px;
  border:1px solid rgba(255,119,119,.15);
  background:rgba(255,119,119,.045);
  color:#e98282;
  font-size:8px;
  font-weight:800;
}

.activateBtn{
  width:100%;
  min-height:36px;
  margin-top:12px;
  border-radius:9px;
  border:1px solid rgba(85,217,150,.18);
  background:rgba(85,217,150,.05);
  color:#6ee3a0;
  font-size:8px;
  font-weight:800;
}

/* ================= EMPTY ================= */

.empty{
  border:1px dashed #292929;
  border-radius:15px;
  padding:45px 20px;
  text-align:center;
  color:#666;
}

.emptyIcon{
  font-size:28px;
  margin-bottom:10px;
}

.emptyText{
  font-size:10px;
}

.loading{
  padding:40px;
  text-align:center;
  color:#666;
  font-size:10px;
}

/* ================= FAB ================= */

.fab{
  position:fixed;
  right:19px;
  bottom:76px;
  z-index:60;
  width:52px;
  height:52px;
  border:0;
  border-radius:16px;
  background:linear-gradient(
    135deg,
    var(--gold-light),
    var(--gold)
  );
  color:#111;
  font-size:25px;
  box-shadow:0 12px 35px rgba(0,0,0,.5);
}

/* ================= BOTTOM NAV ================= */

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:55;
  display:flex;
  justify-content:center;
  gap:3px;
  padding:8px 9px calc(8px + env(safe-area-inset-bottom));
  background:rgba(9,9,9,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid #202020;
}

.navBtn{
  flex:1;
  max-width:120px;
  border:0;
  background:none;
  color:#5e5e5e;
  padding:5px 2px;
  font-size:7px;
  font-weight:800;
}

.navBtn.active{
  color:var(--gold-light);
}

.navIcon{
  display:block;
  font-size:15px;
  margin-bottom:3px;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:9px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(6px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:570px;
  max-height:91vh;
  overflow:auto;
  padding:18px;
  border:1px solid #303030;
  border-radius:21px 21px 13px 13px;
  background:#111;
  animation:modalUp .22s ease;
}

@keyframes modalUp{
  from{
    transform:translateY(25px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.modalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.modalTitle{
  font-size:15px;
  font-weight:800;
}

.modalSub{
  color:#666;
  font-size:9px;
  margin-top:4px;
}

.close{
  width:32px;
  height:32px;
  border:1px solid #292929;
  border-radius:9px;
  background:#171717;
  color:#aaa;
  font-size:17px;
}

/* FORM */

.formGroup{
  margin-bottom:14px;
}

.formLabel{
  display:block;
  color:#686868;
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:6px;
}

.formInput,
.formTextarea{
  width:100%;
  border:1px solid #292929;
  border-radius:10px;
  background:#0b0b0b;
  color:white;
  outline:none;
  padding:12px;
  font-size:11px;
}

.formInput{
  height:43px;
}

.formInput:focus,
.formTextarea:focus{
  border-color:#675432;
}

.formTextarea{
  min-height:75px;
  resize:vertical;
}

/* TYPE */

.typeGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.typeOption{
  border:1px solid #292929;
  background:#0c0c0c;
  border-radius:12px;
  padding:14px 8px;
  color:#777;
  text-align:center;
}

.typeOption.selected{
  border-color:#a9874d;
  background:rgba(215,179,106,.08);
  color:var(--gold-light);
}

.typeIcon{
  display:block;
  font-size:20px;
  margin-bottom:5px;
}

.typeName{
  font-size:9px;
  font-weight:800;
}

/* OPTIONS */

.optionGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.optionBtn{
  min-height:38px;
  border:1px solid #292929;
  background:#0c0c0c;
  border-radius:9px;
  color:#888;
  font-size:9px;
}

.optionBtn.selected{
  color:#111;
  background:var(--gold-light);
  border-color:var(--gold-light);
  font-weight:800;
}

.goldBtn{
  width:100%;
  min-height:43px;
  border:0;
  border-radius:10px;
  background:linear-gradient(
    135deg,
    var(--gold-light),
    var(--gold)
  );
  color:#111;
  font-size:10px;
  font-weight:800;
}

/* HISTORY */

.historyItem{
  padding:12px;
  border:1px solid #242424;
  border-radius:11px;
  background:#0c0c0c;
  margin-bottom:7px;
}

.historyNumber{
  color:var(--gold-light);
  font-size:8px;
  font-weight:800;
  margin-bottom:5px;
}

.historyText{
  color:#c5c5c5;
  font-size:9px;
  line-height:1.6;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  z-index:200;
  transform:translateX(-50%) translateY(15px);
  opacity:0;
  pointer-events:none;
  background:#191919;
  border:1px solid #333;
  color:#eee;
  border-radius:10px;
  padding:10px 14px;
  font-size:9px;
  white-space:nowrap;
  transition:.22s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:500px){

  .container{
    padding-left:13px;
    padding-right:13px;
  }

  .stats{
    gap:6px;
  }

  .stat{
    min-height:68px;
  }

  .statValue{
    font-size:18px;
  }

  .studentCard{
    padding:14px;
  }

  .badges{
    max-width:100px;
  }

  .actions{
    gap:5px;
  }

  .action{
    font-size:7px;
  }

}

@media(max-width:370px){

  .brandSub{
    display:none;
  }

  .clockDate{
    display:none;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .actions{
    grid-template-columns:1fr 1fr;
  }

}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="headerInner">

    <div class="brand">

      <div class="logo">
        A1
      </div>

      <div>
        <div class="brandTitle">
          A1 Attendance
        </div>

        <div class="brandSub">
          DRIVING TRACKING SYSTEM
        </div>
      </div>

    </div>

    <div class="clock">
      <div class="clockTime" id="clockTime">
        --:--
      </div>

      <div class="clockDate" id="clockDate">
        ---
      </div>
    </div>

  </div>

</header>


<!-- ================= MAIN ================= -->

<main class="container">

  <div class="search">

    <span class="searchIcon">
      ⌕
    </span>

    <input
      id="searchInput"
      type="search"
      placeholder="Search student or phone..."
      autocomplete="off">

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="statValue" id="activeCount">0</div>
      <div class="statLabel">ACTIVE</div>
    </div>

    <div class="stat">
      <div class="statValue" id="completedCount">0</div>
      <div class="statLabel">COMPLETED</div>
    </div>

    <div class="stat">
      <div class="statValue" id="liveCount">0</div>
      <div class="statLabel">LIVE NOW</div>
    </div>

    <div class="stat">
      <div class="statValue" id="inactiveCount">0</div>
      <div class="statLabel">NOT ACTIVE</div>
    </div>

  </div>


  <div class="sectionHeader">

    <div class="sectionTitle" id="sectionTitle">
      Active Students
    </div>

    <div class="sectionCount" id="studentCount">
      0 Students
    </div>

  </div>


  <div id="studentCards" class="cards">

    <div class="loading">
      Loading students...
    </div>

  </div>

</main>


<!-- ================= FAB ================= -->

<button
  class="fab"
  onclick="openAddModal()">
  +
</button>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottomNav">

  <button
    class="navBtn active"
    id="navActive"
    onclick="setFilter('active')">

    <span class="navIcon">🚗</span>
    ACTIVE

  </button>


  <button
    class="navBtn"
    id="navCompleted"
    onclick="setFilter('completed')">

    <span class="navIcon">✓</span>
    COMPLETED

  </button>


  <button
    class="navBtn"
    id="navLive"
    onclick="setFilter('live')">

    <span class="navIcon">●</span>
    LIVE

  </button>


  <button
    class="navBtn"
    id="navInactive"
    onclick="setFilter('inactive')">

    <span class="navIcon">⏸</span>
    NOT ACTIVE

  </button>

</nav>


<!-- ================= ADD STUDENT ================= -->

<div class="modal" id="addModal">

  <div class="modalBox">

    <div class="modalHeader">

      <div>
        <div class="modalTitle">
          Add Student
        </div>

        <div class="modalSub">
          Create a new driving student
        </div>
      </div>

      <button
        class="close"
        onclick="closeModal('addModal')">
        ×
      </button>

    </div>


    <div class="formGroup">

      <label class="formLabel">
        Phone Number
      </label>

      <input
        id="studentPhone"
        class="formInput"
        type="tel"
        maxlength="10"
        inputmode="numeric"
        placeholder="10 digit mobile number">

    </div>


    <div class="formGroup">

      <label class="formLabel">
        Full Name
      </label>

      <input
        id="studentName"
        class="formInput"
        type="text"
        placeholder="Student full name">

    </div>


    <div class="formGroup">

      <label class="formLabel">
        Total Classes
      </label>

      <input
        id="totalClasses"
        class="formInput"
        type="number"
        min="1"
        value="20">

    </div>


    <div class="formGroup">

      <label class="formLabel">
        Class Type
      </label>

      <div class="typeGrid">

        <button
          type="button"
          class="typeOption"
          id="addPersonal"
          onclick="selectAddType('Personal')">

          <span class="typeIcon">
            👤
          </span>

          <span class="typeName">
            PERSONAL
          </span>

        </button>


        <button
          type="button"
          class="typeOption selected"
          id="addGroup"
          onclick="selectAddType('Group')">

          <span class="typeIcon">
            👥
          </span>

          <span class="typeName">
            GROUP
          </span>

        </button>

      </div>

    </div>


    <button
      class="goldBtn"
      onclick="saveStudent()">

      SAVE STUDENT

    </button>

  </div>

</div>


<!-- ================= ATTENDANCE ================= -->

<div class="modal" id="attendanceModal">

  <div class="modalBox">

    <div class="modalHeader">

      <div>
        <div class="modalTitle">
          Driving Track
        </div>

        <div
          class="modalSub"
          id="attendanceStudentName">
        </div>
      </div>

      <button
        class="close"
        onclick="closeModal('attendanceModal')">
        ×
      </button>

    </div>


    <div class="formGroup">

      <label class="formLabel">
        Route
      </label>

      <div class="optionGrid">

        <button
          class="optionBtn routeOption"
          onclick="selectRoute(this,'Bhanjpur')">
          Bhanjpur
        </button>

        <button
          class="optionBtn routeOption"
          onclick="selectRoute(this,'Baghra')">
          Baghra
        </button>

        <button
          class="optionBtn routeOption"
          onclick="selectRoute(this,'Badbazar')">
          Badbazar
        </button>

        <button
          class="optionBtn routeOption"
          onclick="selectRoute(this,'Udala')">
          Udala
        </button>

        <button
          class="optionBtn routeOption"
          onclick="selectRoute(this,'Station Bazar')">
          Station Bazar
        </button>

        <button
          class="optionBtn routeOption"
          onclick="selectRoute(this,'Lal Bazar')">
          Lal Bazar
        </button>

        <button
          class="optionBtn routeOption"
          onclick="selectRoute(this,'Kuchei')">
          Kuchei
        </button>

        <button
          class="optionBtn routeOption"

/* ==================================================
   HELPERS
================================================== */

function safe(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getLogs(student){

  return Array.isArray(student.attendanceLogs)
    ? student.attendanceLogs
    : [];

}


function getDone(student){

  const logs =
    getLogs(student);

  const oldValue =
    Number(student.remaining || 0);

  return Math.max(
    logs.length,
    oldValue,
    0
  );

}


function getTotal(student){

  return Math.max(
    Number(student.totalClasses || 0),
    1
  );

}


function isCompleted(student){

  return getDone(student) >= getTotal(student);

}


function isInactive(student){

  return student.notActive === true;

}


/* ==================================================
   TIME
================================================== */

function parseAttendanceTime(log){

  if(!log){
    return null;
  }

  const match =
    String(log).match(
      /(\d{1,2}):(\d{2})\s*(AM|PM)/i
    );

  if(!match){
    return null;
  }

  let hour =
    Number(match[1]);

  const minute =
    Number(match[2]);

  const ampm =
    match[3].toUpperCase();

  if(
    ampm === "PM" &&
    hour !== 12
  ){
    hour += 12;
  }

  if(
    ampm === "AM" &&
    hour === 12
  ){
    hour = 0;
  }

  return {
    hour,
    minute
  };

}


function timeDistance(logs){

  if(!logs.length){
    return 9999;
  }

  const parsed =
    parseAttendanceTime(
      logs[logs.length - 1]
    );

  if(!parsed){
    return 9999;
  }

  const now =
    new Date();

  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();

  const logMinutes =
    parsed.hour * 60 +
    parsed.minute;

  let diff =
    Math.abs(
      currentMinutes -
      logMinutes
    );

  diff =
    Math.min(
      diff,
      1440 - diff
    );

  return diff;

}


function isLive(student){

  if(isInactive(student)){
    return false;
  }

  const logs =
    getLogs(student);

  if(!logs.length){
    return false;
  }

  return timeDistance(logs) <= 30;

}

}

}


/* ==================================================
   LOAD STUDENTS
================================================== */

async function loadStudents(){

  try{

    const snapshot =
      await getDocs(
        studentCollection
      );

    students = [];

    snapshot.forEach(item=>{

      students.push({
        id:item.id,
        ...item.data()
      });

    });

    render();

  }catch(error){

    console.error(error);

    document.getElementById(
      "studentCards"
    ).innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          ⚠️
        </div>

        <div class="emptyText">
          Unable to load students.
          <br>
          Check Firebase configuration.
        </div>

      </div>

    `;

  }

}


/* ==================================================
   RENDER
================================================== */

function render(){

  const search =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  const activeStudents =
    students.filter(
      s=>!isInactive(s)
    );


  const inactiveStudents =
    students.filter(
      s=>isInactive(s)
    );


  document.getElementById(
    "activeCount"
  ).textContent =
    activeStudents.length;


  document.getElementById(
    "completedCount"
  ).textContent =
    students.filter(
      s=>isCompleted(s)
    ).length;


  document.getElementById(
    "liveCount"
  ).textContent =
    activeStudents.filter(
      s=>isLive(s)
    ).length;


  document.getElementById(
    "inactiveCount"
  ).textContent =
    inactiveStudents.length;


  let filtered = [];


  if(currentFilter === "active"){

    filtered =
      [...activeStudents];

  }


  else if(
    currentFilter === "completed"
  ){

    filtered =
      activeStudents.filter(
        s=>isCompleted(s)
      );

  }


  else if(
    currentFilter === "live"
  ){

    filtered =
      activeStudents.filter(
        s=>isLive(s)
      );

  }


  else if(
    currentFilter === "inactive"
  ){

    filtered =
      [...inactiveStudents];

  }


  if(search){

    filtered =
      filtered.filter(student=>{

        const name =
          String(
            student.name || ""
          ).toLowerCase();

        const phone =
          String(
            student.id || ""
          ).toLowerCase();

        return (
          name.includes(search) ||
          phone.includes(search)
        );

      });

  }


  if(
    currentFilter === "active" ||
    currentFilter === "completed" ||
    currentFilter === "live"
  ){

    filtered.sort(
      (a,b)=>
        timeDistance(
          getLogs(a)
        ) -
        timeDistance(
          getLogs(b)
        )
    );

  }else{

    filtered.sort(
      (a,b)=>
        String(a.name || "")
          .localeCompare(
            String(b.name || "")
          )
    );

  }


  const titles = {

    active:
      "Active Students",

    completed:
      "Completed Students",

    live:
      "Live Now",

    inactive:
      "Not Active"

  };


  document.getElementById(
    "sectionTitle"
  ).textContent =
    titles[currentFilter];


  document.getElementById(
    "studentCount"
  ).textContent =
    `${filtered.length} Student${
      filtered.length !== 1
        ? "s"
        : ""
    }`;


  const container =
    document.getElementById(
      "studentCards"
    );


  if(!filtered.length){

    container.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          🚗
        </div>

        <div class="emptyText">
          No students found
        </div>

      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered
      .map(studentCard)
      .join("");

}


/* ==================================================
   STUDENT CARD
================================================== */

function studentCard(student){

  const id =
    student.id;

  const name =
    student.name ||
    "Unnamed Student";

  const logs =
    getLogs(student);

  const total =
    getTotal(student);

  const done =
    getDone(student);

  const percentage =
    Math.min(
      100,
      Math.round(
        (done / total) * 100
      )
    );

  const inactive =
    isInactive(student);

  const live =
    isLive(student);

  const completed =
    isCompleted(student);


  /*
    IMPORTANT:
    Old students which don't have
    classType will also display
    as GROUP by default.
  */

  const type =
    student.classType === "Personal"
      ? "Personal"
      : "Group";


  let lastText =
    "No attendance yet";


  if(logs.length){

    lastText =
      logs[logs.length - 1];

  }


  let badges = "";


  if(inactive){

    badges += `
      <span class="badge inactive">
        NOT ACTIVE
      </span>
    `;

  }else{

    if(live){

      badges += `
        <span class="badge live">
          ● LIVE
        </span>
      `;

    }


    if(completed){

      badges += `
        <span class="badge completed">
          COMPLETED
        </span>
      `;

    }else{

      badges += `
        <span class="badge active">
          ACTIVE
        </span>
      `;

    }

  }


  const cardClass =
    inactive
      ? "studentCard inactive"
      : "studentCard";


  let actions = "";


  if(!inactive){

    actions = `

      <div class="actions">

        <button
          class="action attend"
          onclick="openAttendance('${safe(id)}')">
          + ATTEND
        </button>

        <button
          class="action"
          onclick="openHistory('${safe(id)}')">
          📋 LOGS
        </button>

        <button
          class="action wa"
          onclick="sendWhatsApp('${safe(id)}')">
          💬 WA
        </button>

        <button
          class="action call"
          onclick="callStudent('${safe(id)}')">
          📞 CALL
        </button>

      </div>


      ${
        !completed
        ? `

          <button
            class="notActiveBtn"
            onclick="markNotActive('${safe(id)}')">

            ⏸ MARK NOT ACTIVE

          </button>

        `
        : ""
      }

    `;

  }else{

    actions = `

      <button
        class="activateBtn"
        onclick="activateStudent('${safe(id)}')">

        ✓ ACTIVE AGAIN

      </button>


      <div class="actions">

        <button
          class="action attend"
          onclick="openAttendance('${safe(id)}')">
          + ATTEND
        </button>

        <button
          class="action"
          onclick="openHistory('${safe(id)}')">
          📋 LOGS
        </button>

        <button
          class="action wa"
          onclick="sendWhatsApp('${safe(id)}')">
          💬 WA
        </button>

        <button
          class="action call"
          onclick="callStudent('${safe(id)}')">
          📞 CALL
        </button>

      </div>

    `;

  }


  return `

    <div class="${cardClass}">

      <div class="studentHeader">

        <div class="avatar">
          ${safe(
            name
              .charAt(0)
              .toUpperCase()
          )}
        </div>


        <div class="studentInfo">

          <div class="studentName">
            ${safe(name)}
          </div>

          <div class="studentPhone">
            📱 ${safe(id)}
          </div>

        </div>


        <div class="badges">
          ${badges}
        </div>

      </div>


      <div class="typeRow">

        <div class="typeInfo">

          <span class="typeLabel">
            Class
          </span>

          <span class="typeValue">

            ${
              type === "Personal"
                ? "👤 PERSONAL"
                : "👥 GROUP"
            }

          </span>

        </div>


        <button
          class="editType"
          onclick="openTypeModal('${safe(id)}')">

          ✏️ EDIT

        </button>

      </div>


      <div class="lastAttendance">

        <div class="lastLabel">
          Last Attendance
        </div>

        <div class="lastText">
          ${safe(lastText)}
        </div>

      </div>


      <div class="progressBox">

        <div class="progressTop">

          <span class="progressLabel">
            TRAINING PROGRESS
          </span>

          <span class="progressCount">
            ${done} / ${total}
          </span>

        </div>


        <div class="progress">

          <div
            class="progressBar"
            style="width:${percentage}%">
          </div>

        </div>

      </div>


      ${actions}

    </div>

  `;

}

window.saveStudent =
async function(){

  const phone =
    document
      .getElementById(
        "studentPhone"
      )
      .value
      .trim();


  const name =
    document
      .getElementById(
        "studentName"
      )
      .value
      .trim();


  const total =
    Number(
      document
        .getElementById(
          "totalClasses"
        )
        .value
    );


  if(
    !/^[0-9]{10}$/.test(
      phone
    )
  ){

    showToast(
      "Enter valid 10 digit phone"
    );

    return;

  }


  if(!name){

    showToast(
      "Enter student name"
    );

    return;

  }


  if(total < 1){

    showToast(
      "Enter valid total classes"
    );

    return;

  }


  try{

    await setDoc(

      doc(
        db,
        "studentData",
        phone
      ),

      {

        name:name,

        totalClasses:total,

        remaining:0,

        attendanceLogs:[],

        /*
          NEW STUDENTS ARE
          GROUP BY DEFAULT
        */

        classType:
          addClassType || "Group",

        notActive:false

      },

      {
        merge:true
      }

    );


    closeModal(
      "addModal"
    );


    showToast(
      "Student added successfully ✓"
    );


    await loadStudents();


  }catch(error){

    console.error(error);

    showToast(
      "Could not save student"
    );

  }

};

    )
    .forEach(x=>{
      x.classList.remove(
        "selected"
      );
    });


  btn.classList.add(
    "selected"
  );

};


window.saveAttendance =
async function(){

  if(!currentStudentId){
    return;
  }


  if(!selectedRoute){

    showToast(
      "Select route"
    );

    return;

  }


  if(!selectedDistance){

    showToast(
      "Select distance"
    );

    return;

  }


  const custom =
    document
      .getElementById(
        "customRemark"
      )
      .value
      .trim();


  const now =
    new Date();


  const datePart =
    now.toLocaleDateString(
      "en-IN",
      {
        day:"2-digit",
        month:"short"
      }
    );


  const timePart =
    now.toLocaleTimeString(
      "en-IN",
      {
        hour:"2-digit",
        minute:"2-digit",
        hour12:true
      }
    );


  let remark =
    selectedRemark;


  if(custom){

    remark =
      remark
        ? `${remark} | ${custom}`
        : custom;

  }


  const log =
    `${datePart} | ${timePart} — Route: ${selectedRoute} | Distance: ${selectedDistance}${remark ? ` | Remark: ${remark}` : ""}`;


  const student =
    students.find(
      s=>s.id === currentStudentId
    );


  const currentDone =
    student
      ? getDone(student)
      : 0;


  try{

    await updateDoc(

      doc(
        db,
        "studentData",
        currentStudentId
      ),

      {

        remaining:
          currentDone + 1,

        attendanceLogs:
          arrayUnion(log),

        /*
          Attendance automatically
          makes the student ACTIVE.
        */

        notActive:false

      }

    );


    closeModal(
      "attendanceModal"
    );


    showToast(
      "Attendance added ✓"
    );


    await loadStudents();


  }catch(error){

    console.error(error);

    showToast(
      "Could not save attendance"
    );

  }

};

/* ==================================================
   HISTORY
================================================== */

window.openHistory =
function(id){

  currentStudentId =
    id;


  const student =
    students.find(
      s=>s.id === id
    );


  if(!student){
    return;
  }


  document.getElementById(
    "historyStudentName"
  ).textContent =
    `${student.name || ""} • ${id}`;


  const logs =
    [
      ...getLogs(student)
    ].reverse();


  const list =
    document.getElementById(
      "historyList"
    );


  if(!logs.length){

    list.innerHTML = `

      <div class="empty">

        <div class="emptyIcon">
          📋
        </div>

        <div class="emptyText">
          No attendance history
        </div>

      </div>

    `;

  }else{

    list.innerHTML =
      logs.map(
        (log,index)=>`

          <div class="historyItem">

            <div class="historyNumber">
              SESSION ${logs.length-index}
            </div>

            <div class="historyText">
              ${safe(log)}
            </div>

          </div>

        `
      ).join("");

  }


  document
    .getElementById(
      "historyModal"
    )
    .classList.add(
      "show"
    );

};


/* ==================================================
   WHATSAPP
================================================== */

window.sendWhatsApp =
function(id){

  const student =
    students.find(
      s=>s.id === id
    );


  if(!student){
    return;
  }


  const total =
    getTotal(student);


  const done =
    getDone(student);


  const left =
    Math.max(
      total - done,
      0
    );


  const classType =
    student.classType === "Personal"
      ? "Personal"
      : "Group";


  const message =
`Hello *${String(student.name || "").trim()}*,

*A1 Driving Classes Attendance*

🚗 Completed: *${done}/${total}*
⏳ Balance: *${left} Sessions*
📚 Class Type: *${classType}*

Keep learning and drive safely! 🚗🔥`;


  const url =
    `https://wa.me/${id}?text=${encodeURIComponent(message)}`;


  window.open(
    url,
    "_blank"
  );

};

/* ==================================================
   CLOSE MODALS
================================================== */

window.closeModal =
function(id){

  document
    .getElementById(id)
    .classList.remove(
      "show"
    );

};


document
  .querySelectorAll(
    ".modal"
  )
  .forEach(modal=>{

    modal.addEventListener(
      "click",
      function(e){

        if(
          e.target === modal
        ){

          modal.classList.remove(
            "show"
          );

        }

      }
    );

  });


document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Escape"
    ){

      document
        .querySelectorAll(
          ".modal.show"
        )
        .forEach(modal=>{

          modal.classList.remove(
            "show"
          );

        });

    }

  }
);


/* ==================================================
   AUTO REFRESH
================================================== */

setInterval(
  loadStudents,
  30000
);


/* ==================================================
   START
================================================== */

loadStudents();
