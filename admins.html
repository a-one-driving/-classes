<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>A1 Attendance | Driving Classes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#08090b;
    --card:#111318;
    --card2:#151820;
    --line:rgba(255,255,255,.08);
    --text:#f5f5f5;
    --muted:#9298a5;
    --gold:#d7ad55;
    --gold2:#f0ca70;
    --green:#34d399;
    --red:#ff5f6d;
    --blue:#60a5fa;
    --orange:#fb923c;
    --purple:#a78bfa;
    --radius:24px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 20% 0%,rgba(215,173,85,.08),transparent 30%),
        radial-gradient(circle at 100% 20%,rgba(96,165,250,.05),transparent 25%),
        var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:100px;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.container{
    width:min(100%,760px);
    margin:auto;
    padding:16px;
}

/* ================= HEADER ================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 2px 18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo{
    width:45px;
    height:45px;
    border-radius:15px;
    display:grid;
    place-items:center;
    font-weight:800;
    color:#111;
    background:linear-gradient(135deg,var(--gold2),var(--gold));
    box-shadow:0 8px 25px rgba(215,173,85,.18);
}

.brandText h1{
    font-size:18px;
    font-weight:800;
}

.brandText p{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.headerActions{
    display:flex;
    gap:8px;
}

.iconBtn{
    width:42px;
    height:42px;
    border-radius:14px;
    background:var(--card);
    border:1px solid var(--line);
    color:white;
    display:grid;
    place-items:center;
    font-size:17px;
}

/* ================= PAYMENT HERO ================= */

.paymentHero{
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(135deg,rgba(215,173,85,.20),rgba(215,173,85,.04)),
        var(--card);
    border:1px solid rgba(215,173,85,.24);
    border-radius:28px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 18px 45px rgba(0,0,0,.24);
}

.paymentHero:before{
    content:"";
    position:absolute;
    width:160px;
    height:160px;
    border-radius:50%;
    right:-70px;
    top:-70px;
    background:rgba(215,173,85,.10);
}

.paymentTop{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.paymentLabel{
    color:#c8cbd1;
    font-size:12px;
    font-weight:600;
}

.paymentTotal{
    font-size:34px;
    line-height:1.1;
    font-weight:800;
    margin-top:5px;
    letter-spacing:-1px;
}

.paymentMonth{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

.paymentIcon{
    width:48px;
    height:48px;
    border-radius:17px;
    display:grid;
    place-items:center;
    background:rgba(215,173,85,.12);
    border:1px solid rgba(215,173,85,.22);
    font-size:21px;
}

.paymentBreakdown{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

.paymentBox{
    background:rgba(0,0,0,.20);
    border:1px solid rgba(255,255,255,.06);
    border-radius:18px;
    padding:13px;
}

.paymentBox .small{
    font-size:10px;
    color:var(--muted);
    margin-bottom:5px;
}

.paymentBox .amount{
    font-size:18px;
    font-weight:800;
}

.paymentBox.personal .amount{
    color:var(--blue);
}

.paymentBox.group .amount{
    color:var(--purple);
}

/* ================= SEARCH ================= */

.searchBox{
    position:relative;
    margin-bottom:14px;
}

.searchBox input{
    width:100%;
    height:52px;
    border-radius:18px;
    border:1px solid var(--line);
    outline:none;
    background:var(--card);
    color:white;
    padding:0 16px 0 46px;
    font-size:13px;
}

.searchBox span{
    position:absolute;
    left:17px;
    top:16px;
    color:var(--muted);
}

/* ================= STATS ================= */

.statsGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:15px;
}

.stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:12px 8px;
    text-align:center;
}

.statNumber{
    font-size:20px;
    font-weight:800;
}

.statLabel{
    color:var(--muted);
    font-size:9px;
    margin-top:3px;
}

/* ================= SECTION ================= */

.sectionHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 2px 10px;
}

.sectionHead h2{
    font-size:15px;
    font-weight:800;
}

.sectionHead span{
    font-size:10px;
    color:var(--muted);
}

/* ================= STUDENT CARD ================= */

.students{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.studentCard{
    position:relative;
    background:
        linear-gradient(145deg,rgba(255,255,255,.035),transparent),
        var(--card);
    border:1px solid var(--line);
    border-radius:27px;
    padding:18px;
    overflow:hidden;
    transition:.2s;
}

.studentCard:active{
    transform:scale(.99);
}

.studentCard.live{
    border-color:rgba(52,211,153,.28);
}

.studentCard.completed{
    border-color:rgba(96,165,250,.22);
}

.studentHeader{
    display:flex;
    align-items:center;
    gap:13px;
}

.avatar{
    width:52px;
    height:52px;
    flex:none;
    border-radius:18px;
    display:grid;
    place-items:center;
    font-size:18px;
    font-weight:800;
    color:#111;
    background:linear-gradient(135deg,#f1cd77,#b88c32);
}

.studentInfo{
    min-width:0;
    flex:1;
}

.studentName{
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.studentPhone{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.statusPill{
    padding:6px 9px;
    border-radius:999px;
    font-size:9px;
    font-weight:700;
    white-space:nowrap;
}

.statusActive{
    color:#7ff1c2;
    background:rgba(52,211,153,.10);
}

.statusCompleted{
    color:#93c5fd;
    background:rgba(96,165,250,.10);
}

.statusInactive{
    color:#ff929b;
    background:rgba(255,95,109,.10);
}

.statusLive{
    color:#7ff1c2;
    background:rgba(52,211,153,.14);
    animation:pulse 1.6s infinite;
}

@keyframes pulse{
    50%{box-shadow:0 0 0 5px rgba(52,211,153,.05)}
}

.typeRow{
    display:flex;
    gap:7px;
    margin-top:13px;
}

.typeBadge{
    padding:6px 10px;
    border-radius:10px;
    font-size:9px;
    font-weight:700;
    border:1px solid var(--line);
}

.typePersonal{
    color:#8ec5ff;
    background:rgba(96,165,250,.08);
}

.typeGroup{
    color:#c7adff;
    background:rgba(167,139,250,.08);
}

/* ================= PROGRESS ================= */

.progressSection{
    margin-top:16px;
}

.progressTop{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    margin-bottom:7px;
}

.progressTop span:first-child{
    color:var(--muted);
}

.progressTop span:last-child{
    font-weight:700;
}

.progressBar{
    height:8px;
    border-radius:999px;
    background:#22252d;
    overflow:hidden;
}

.progressFill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,var(--gold),var(--gold2));
    transition:.5s;
}

/* ================= INFO GRID ================= */

.infoGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:15px;
}

.infoItem{
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.05);
    border-radius:15px;
    padding:11px 9px;
}

.infoItem .label{
    color:var(--muted);
    font-size:9px;
}

.infoItem .value{
    font-size:12px;
    font-weight:700;
    margin-top:4px;
}

/* ================= ACTIONS ================= */

.actionGrid{
    display:grid;
    grid-template-columns:1.2fr 1fr 1fr;
    gap:8px;
    margin-top:15px;
}

.actionBtn{
    min-height:43px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#181b21;
    color:white;
    font-size:10px;
    font-weight:700;
}

.actionPrimary{
    background:linear-gradient(135deg,#e0b85f,#b98c34);
    color:#111;
    border:0;
}

.actionGreen{
    color:#73e8b8;
}

.actionBlue{
    color:#86bdff;
}

.actionRed{
    color:#ff8d97;
}

/* ================= EMPTY ================= */

.empty{
    padding:45px 20px;
    text-align:center;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
}

.emptyIcon{
    font-size:35px;
    margin-bottom:10px;
}

.empty h3{
    font-size:14px;
}

.empty p{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

/* ================= BOTTOM NAV ================= */

.bottomNav{
    position:fixed;
    z-index:50;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    width:min(calc(100% - 22px),520px);
    padding:8px;
    border-radius:23px;
    background:rgba(18,20,25,.94);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 20px 50px rgba(0,0,0,.45);
    display:grid;
    grid-template-columns:repeat(5,1fr);
}

.navItem{
    min-height:53px;
    border-radius:17px;
    background:transparent;
    color:#777d88;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:9px;
    font-weight:700;
}

.navItem .navIcon{
    font-size:17px;
}

.navItem.active{
    color:#f0ca70;
    background:rgba(215,173,85,.09);
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
}

.modal.show{
    display:flex;
}

.sheet{
    width:min(100%,650px);
    max-height:92vh;
    overflow:auto;
    background:#101216;
    border:1px solid var(--line);
    border-radius:29px 29px 0 0;
    padding:20px 16px calc(25px + env(safe-area-inset-bottom));
    animation:sheetUp .25s ease;
}

@keyframes sheetUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

.sheetHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.sheetHead h3{
    font-size:17px;
}

.close{
    width:38px;
    height:38px;
    border-radius:13px;
    background:#1b1e24;
    color:white;
}

.field{
    margin-bottom:12px;
}

.field label{
    display:block;
    color:#aeb3bd;
    font-size:10px;
    margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid var(--line);
    background:#171a20;
    color:white;
    outline:none;
    border-radius:15px;
    min-height:48px;
    padding:0 13px;
    font-size:12px;
}

.field textarea{
    padding-top:12px;
    min-height:90px;
    resize:none;
}

.formGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.saveBtn{
    width:100%;
    min-height:51px;
    margin-top:6px;
    border-radius:17px;
    background:linear-gradient(135deg,#efca72,#bd9037);
    color:#111;
    font-weight:800;
}

/* ================= TYPE SWITCH ================= */

.typeSwitch{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.typeChoice{
    min-height:47px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#171a20;
    color:#8e949e;
    font-size:11px;
    font-weight:700;
}

.typeChoice.selected{
    color:#111;
    background:linear-gradient(135deg,#efca72,#bd9037);
}

/* ================= HISTORY ================= */

.historyList{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.historyItem{
    background:#171a20;
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
}

.historyTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.historyRoute{
    font-size:12px;
    font-weight:800;
}

.historyDate{
    color:var(--muted);
    font-size:9px;
}

.historyBottom{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:6px;
    color:#aeb3bd;
    font-size:10px;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    z-index:200;
    left:50%;
    bottom:85px;
    transform:translate(-50%,20px);
    background:#f3f3f3;
    color:#111;
    padding:11px 16px;
    border-radius:14px;
    font-size:11px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:30px;
    color:var(--muted);
    font-size:11px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:430px){
    .container{
        padding:13px;
    }

    .paymentTotal{
        font-size:31px;
    }

    .statsGrid{
        gap:6px;
    }

    .stat{
        padding:11px 5px;
    }

    .statNumber{
        font-size:18px;
    }

    .infoGrid{
        grid-template-columns:repeat(3,1fr);
    }

    .actionGrid{
        grid-template-columns:1.15fr 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <div class="logo">A1</div>

            <div class="brandText">
                <h1>A1 Driving Classes</h1>
                <p>Attendance & Student Management</p>
            </div>
        </div>

        <div class="headerActions">
            <button class="iconBtn" onclick="loadStudents()">↻</button>
            <button class="iconBtn" onclick="openAddStudent()">＋</button>
        </div>
    </header>

    <!-- MONTHLY PAYMENT -->
    <section class="paymentHero">

        <div class="paymentTop">

            <div>
                <div class="paymentLabel">
                    TOTAL PAYMENT RECEIVED THIS MONTH
                </div>

                <div class="paymentTotal" id="monthlyPayment">
                    ₹0
                </div>

                <div class="paymentMonth" id="paymentMonth">
                    Loading...
                </div>
            </div>

            <div class="paymentIcon">
                ₹
            </div>

        </div>

        <div class="paymentBreakdown">

            <div class="paymentBox personal">
                <div class="small">
                    PERSONAL CLASS
                </div>

                <div class="amount" id="personalPayment">
                    ₹0
                </div>
            </div>

            <div class="paymentBox group">
                <div class="small">
                    GROUP CLASS
                </div>

                <div class="amount" id="groupPayment">
                    ₹0
                </div>
            </div>

        </div>

    </section>

    <!-- SEARCH -->
    <div class="searchBox">
        <span>⌕</span>

        <input
            id="searchInput"
            type="search"
            placeholder="Search student name or phone..."
            oninput="renderStudents()"
        >
    </div>

    <!-- STATS -->
    <div class="statsGrid">

        <div class="stat">
            <div class="statNumber" id="activeCount">0</div>
            <div class="statLabel">ACTIVE</div>
        </div>

        <div class="stat">
            <div class="statNumber" id="completedCount">0</div>
            <div class="statLabel">DONE</div>
        </div>

        <div class="stat">
            <div class="statNumber" id="liveCount">0</div>
            <div class="statLabel">LIVE</div>
        </div>

        <div class="stat">
            <div class="statNumber" id="inactiveCount">0</div>
            <div class="statLabel">INACTIVE</div>
        </div>

    </div>

    <!-- STUDENTS -->
    <div class="sectionHead">
        <h2 id="listTitle">All Students</h2>
        <span id="studentTotal">0 students</span>
    </div>

    <div id="students" class="students">
        <div class="loading">Loading students...</div>
    </div>

</div>

<!-- BOTTOM NAV -->

<nav class="bottomNav">

    <button class="navItem active" onclick="setFilter('all',this)">
        <span class="navIcon">⌂</span>
        <span>All</span>
    </button>

    <button class="navItem" onclick="setFilter('active',this)">
        <span class="navIcon">●</span>
        <span>Active</span>
    </button>

    <button class="navItem" onclick="setFilter('live',this)">
        <span class="navIcon">◉</span>
        <span>Live</span>
    </button>

    <button class="navItem" onclick="setFilter('completed',this)">
        <span class="navIcon">✓</span>
        <span>Done</span>
    </button>

    <button class="navItem" onclick="setFilter('inactive',this)">
        <span class="navIcon">○</span>
        <span>Inactive</span>
    </button>

</nav>

<!-- ADD / EDIT STUDENT MODAL -->

<div class="modal" id="studentModal">

    <div class="sheet">

        <div class="sheetHead">
            <h3 id="studentModalTitle">Add Student</h3>
            <button class="close" onclick="closeModal('studentModal')">✕</button>
        </div>

        <input type="hidden" id="editStudentId">

        <div class="field">
            <label>STUDENT NAME</label>
            <input id="studentName" placeholder="Enter student name">
        </div>

        <div class="field">
            <label>PHONE NUMBER</label>
            <input id="studentPhone" type="tel" placeholder="10 digit mobile number">
        </div>

        <div class="formGrid">

            <div class="field">
                <label>TOTAL CLASSES</label>
                <input id="totalClasses" type="number" value="20">
            </div>

            <div class="field">
                <label>PAYMENT RECEIVED</label>
                <input id="paymentAmount" type="number" placeholder="₹ Amount">
            </div>

        </div>

        <div class="field">
            <label>CLASS TYPE</label>

            <div class="typeSwitch">

                <button
                    id="typePersonal"
                    class="typeChoice selected"
                    onclick="selectType('Personal')"
                >
                    PERSONAL
                </button>

                <button
                    id="typeGroup"
                    class="typeChoice"
                    onclick="selectType('Group')"
                >
                    GROUP
                </button>

            </div>
        </div>

        <button class="saveBtn" onclick="saveStudent()">
            SAVE STUDENT
        </button>

    </div>

</div>

<!-- ATTENDANCE MODAL -->

<div class="modal" id="attendanceModal">

    <div class="sheet">

        <div class="sheetHead">
            <div>
                <h3>Mark Attendance</h3>
                <div id="attendanceStudentName"
                     style="font-size:10px;color:#9298a5;margin-top:3px;">
                </div>
            </div>

            <button class="close" onclick="closeModal('attendanceModal')">
                ✕
            </button>
        </div>

        <input type="hidden" id="attendanceStudentId">

        <div class="field">
            <label>ROUTE</label>

            <select id="route">
                <option>Bhanjpur</option>
                <option>Baghra</option>
                <option>Badbazar</option>
                <option>Udala</option>
                <option>Station Bazar</option>
                <option>Lal Bazar</option>
                <option>Kuchei</option>
                <option>Other Route</option>
            </select>
        </div>

        <div class="field">
            <label>DRIVING REMARK</label>

            <select id="remark">

                <option>Good Driving</option>
                <option>Needs Improvement</option>
                <option>Good Turning</option>
                <option>Bad Turning</option>
                <option>Good Braking</option>
                <option>Bad Braking</option>
                <option>Good Clutch</option>
                <option>Clutch Improvement</option>
                <option>Good Traffic Control</option>
                <option>Good Vehicle Control</option>
                <option>Good Parking</option>
                <option>Parking Improvement</option>
                <option>Custom Remark</option>

            </select>

        </div>

        <div class="field" id="customRemarkBox" style="display:none;">
            <label>CUSTOM REMARK</label>
            <textarea id="customRemark"></textarea>
        </div>

        <button class="saveBtn" onclick="markAttendance()">
            MARK ATTENDANCE
        </button>

    </div>

</div>

<!-- HISTORY MODAL -->

<div class="modal" id="historyModal">

    <div class="sheet">

        <div class="sheetHead">

            <div>
                <h3>Attendance History</h3>

                <div

            </button>

</div>

<!-- TOAST -->

<div class="toast" id="toast"></div>


<script type="module">

/* ============================================================
   FIREBASE
============================================================ */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    doc,
    serverTimestamp,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "abinash-driving.firebaseapp.com",

    projectId: "abinash-driving",

    storageBucket: "abinash-driving.appspot.com",

    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

    appId: "YOUR_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const studentsRef = collection(db,"studentData");


/* ============================================================
   GLOBAL
============================================================ */

let students = [];

let currentFilter = "all";

let selectedClassType = "Personal";

let unsubscribeStudents = null;


/* ============================================================
   HELPERS
============================================================ */

function money(value){

    const n = Number(value || 0);

    return "₹" + n.toLocaleString("en-IN");

}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function getName(student){

    return student.name ||
           student.studentName ||
           student.fullName ||
           "Unnamed Student";

}


function getPhone(student){

    return student.phone ||
           student.mobile ||
           student.phoneNumber ||
           "";

}


function getClassType(student){

    return String(
        student.classType ||
        student.trainingType ||
        student.sessionType ||
        student.type ||
        "Group"
    ).toLowerCase() === "personal"
        ? "Personal"
        : "Group";

}


function getTotalClasses(student){

    return Number(
        student.totalClasses ||
        student.totalClass ||
        student.classes ||
        20
    );

}


function getAttendanceLogs(student){

    if(Array.isArray(student.attendanceLogs))
        return student.attendanceLogs;

    if(Array.isArray(student.attendanceHistory))
        return student.attendanceHistory;

    if(Array.isArray(student.attendance))
        return student.attendance;

    return [];

}


function getCompletedClasses(student){

    const logs = getAttendanceLogs(student);

    if(logs.length)
        return logs.length;

    if(student.completedClasses !== undefined)
        return Number(student.completedClasses || 0);

    if(student.attendedClasses !== undefined)
        return Number(student.attendedClasses || 0);

    const total = getTotalClasses(student);

    if(student.remaining !== undefined)
        return Math.max(0,total - Number(student.remaining));

    return 0;

}


function getRemainingClasses(student){

    const total = getTotalClasses(student);

    return Math.max(
        0,
        total - getCompletedClasses(student)
    );

}


function getLastAttendance(student){

    const logs = getAttendanceLogs(student);

    if(!logs.length)
        return null;

    const sorted = [...logs].sort((a,b)=>{

        const ta = getTimeValue(a);

        const tb = getTimeValue(b);

        return tb-ta;

    });

    return sorted[0];

}


function getTimeValue(log){

    if(!log)
        return 0;

    const raw =
        log.timestamp ||
        log.date ||
        log.createdAt ||
        log.time;

    if(!raw)
        return 0;

    if(raw?.seconds)
        return raw.seconds * 1000;

    const d = new Date(raw);

    return isNaN(d.getTime()) ? 0 : d.getTime();

}


function isLive(student){

    const last = getLastAttendance(student);

    if(!last)
        return false;

    const time = getTimeValue(last);

    if(!time)
        return false;

    return Date.now() - time <= 30 * 60 * 1000;

}


function isCompleted(student){

    return getCompletedClasses(student) >= getTotalClasses(student);

}


function isInactive(student){

    return Boolean(
        student.active === false ||
        student.status === "inactive" ||
        student.status === "Not Active"
    );

}


/* ============================================================
   PAYMENT ENGINE
============================================================ */

/*
   Supports common payment structures:

   paymentLogs:[{amount,date,type}]
   payments:[{amount,date,type}]
   paymentHistory:[{amount,date,type}]
   paymentsReceived:[{amount,date,type}]
   transactions:[{amount,date,type}]
   payment:number
   amountPaid:number
   paidAmount:number
   paymentAmount:number
   feePaid:number
   feesPaid:number
*/


function getPaymentArray(student){

    const possible = [

        student.paymentLogs,

        student.payments,

        student.paymentHistory,

        student.paymentsReceived,

        student.transactions

    ];

    for(const item of possible){

        if(Array.isArray(item))
            return item;

    }

    return [];

}


function getPaymentDate(item){

    return (
        item?.date ||
        item?.paymentDate ||
        item?.timestamp ||
        item?.createdAt ||
        item?.time ||
        null
    );

}


function getPaymentAmount(item){

    return Number(
        item?.amount ??
        item?.payment ??
        item?.value ??
        item?.paidAmount ??
        item?.amountPaid ??
        item?.paymentAmount ??
        0
    ) || 0;

}


function paymentType(item,student){

    const raw = String(

        item?.classType ||
        item?.trainingType ||
        item?.sessionType ||
        item?.type ||
        student.classType ||
        "Group"

    ).toLowerCase();

    return raw.includes("personal")
        ? "Personal"
        : "Group";

}


function isCurrentMonth(dateValue){

    if(!dateValue)
        return false;

    let date;

    if(dateValue?.seconds){

        date = new Date(dateValue.seconds * 1000);

    }else{

        date = new Date(dateValue);

    }

    if(isNaN(date.getTime()))
        return false;

    const now = new Date();

    return (
        date.getMonth() === now.getMonth() &&
        date.getFullYear() === now.getFullYear()
    );

}


function calculateMonthlyPayments(){

    let personal = 0;

    let group = 0;

    for(const student of students){

        const payments = getPaymentArray(student);

        /*
           Preferred:
           payment records contain their own date/type.
        */

        if(payments.length){

            for(const payment of payments){

                if(!isCurrentMonth(getPaymentDate(payment)))
                    continue;

                const amount = getPaymentAmount(payment);

                if(paymentType(payment,student) === "Personal")
                    personal += amount;
                else
                    group += amount;

            }

            continue;
        }


        /*
           Fallback:
           If there is no payment array, use a single payment
           only if a payment date exists and is this month.
        */

        const singleAmount = Number(
            student.payment ??
            student.lastPayment ??
            student.paymentReceived ??
            student.amountPaid ??
            student.paidAmount ??
            student.paymentAmount ??
            student.feePaid ??
            student.feesPaid ??
            0
        ) || 0;


        const singleDate =
            student.paymentDate ||
            student.lastPaymentDate ||
            student.paymentReceivedDate ||
            student.updatedAt ||
            student.createdAt;


        if(singleAmount > 0 && isCurrentMonth(singleDate)){

            if(getClassType(student) === "Personal")
                personal += singleAmount;
            else
                group += singleAmount;

        }

    }


    return {
        personal,
        group,
        total: personal + group
    };

}


function renderMonthlyPayment(){

    const result = calculateMonthlyPayments();

    document.getElementById("monthlyPayment").textContent =
        money(result.total);

    document.getElementById("personalPayment").textContent =
        money(result.personal);

    document.getElementById("groupPayment").textContent =
        money(result.group);


    const now = new Date();

    document.getElementById("paymentMonth").textContent =
        now.toLocaleDateString("en-IN",{
            month:"long",
            year:"numeric"
        }) + " • Received";
}


/* ============================================================
   LOAD STUDENTS
============================================================ */

async function loadStudents(){

    try{

        const snapshot = await getDocs(studentsRef);

        students = snapshot.docs.map(d=>({

            id:d.id,

            ...d.data()

        }));

        renderAll();

        toast("Data refreshed");

    }catch(error){

        console.error(error);

        toast("Unable to load Firebase data");

    }

}


/* ============================================================
   REALTIME LISTENER
============================================================ */

function startRealtime(){

    if(unsubscribeStudents)
        unsubscribeStudents();

    unsubscribeStudents = onSnapshot(
        studentsRef,
        snapshot=>{

            students = snapshot.docs.map(d=>({

                id:d.id,

                ...d.data()

            }));

            renderAll();

        },
        error=>{

            console.error(error);

            toast("Firebase connection error");

        }
    );

}


/* ============================================================
   RENDER ALL
============================================================ */

function renderAll(){

    updateStats();

    renderMonthlyPayment();

    renderStudents();

}


/* ============================================================
   STATS
============================================================ */

function updateStats(){

    const active = students.filter(
        s => !isInactive(s) && !isCompleted(s)
    ).length;

    const completed = students.filter(
        s => isCompleted(s)
    ).length;

    const live = students.filter(
        s => isLive(s)
    ).length;

    const inactive = students.filter(
        s => isInactive(s)
    ).length;


    document.getElementById("activeCount").textContent = active;

    document.getElementById("completedCount").textContent = completed;

    document.getElementById("liveCount").textContent = live;

    document.getElementById("inactiveCount").textContent = inactive;

}


/* ============================================================
   FILTER
============================================================ */

window.setFilter = function(filter,button){

    currentFilter = filter;

    document.querySelectorAll(".navItem")
        .forEach(item=>item.classList.remove("active"));

    button.classList.add("active");

    renderStudents();

};


/* ============================================================
   STUDENT FILTER
============================================================ */

function filterStudents(){

    let result = [...students];

    const search =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    if(search){

        result = result.filter(student=>{

            const name = getName(student).toLowerCase();

            const phone = getPhone(student).toLowerCase();

            return (
                name.includes(search) ||
                phone.includes(search)
            );

        });

    }


    if(currentFilter === "active"){

        result = result.filter(
            s=>!isInactive(s) && !isCompleted(s)
        );

    }

    if(currentFilter === "completed"){

        result = result.filter(
            s=>isCompleted(s)
        );

    }

    if(currentFilter === "live"){

        result = result.filter(
            s=>isLive(s)
        );

    }

    if(currentFilter === "inactive"){

        result = result.filter(
            s=>isInactive(s)
        );

    }


    return result;

}


/* ============================================================
   STUDENT CARDS
============================================================ */

window.renderStudents = function(){

    const container =
        document.getElementById("students");

    const list = filterStudents();


    const titleMap = {

        all:"All Students",

        active:"Active Students",

        live:"Live Sessions",

        completed:"Completed Students",

        inactive:"Not Active"

    };


    document.getElementById("listTitle").textContent =
        titleMap[currentFilter] || "Students";

    document.getElementById("studentTotal").textContent =
        list.length + (list.length === 1 ? " student" : " students");


    if(!list.length){

        container.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">🚗</div>

                <h3>No students found</h3>

                <p>Try another search or filter.</p>

            </div>

        `;

        return;

    }


    container.innerHTML = list.map(student=>{

        const name = getName(student);

        const phone = getPhone(student);

        const total = getTotalClasses(student);

        const completed = getCompletedClasses(student);

        const remaining = getRemainingClasses(student);

        const percent = total
            ? Math.min(100,Math.round((completed/total)*100))
            : 0;

        const type = getClassType(student);

        const live = isLive(student);

        const inactive = isInactive(student);

        const done = isCompleted(student);


        let statusClass = "statusActive";

        let statusText = "ACTIVE";


        if(inactive){

            statusClass = "statusInactive";

            statusText = "NOT ACTIVE";

        }else if(done){

            statusClass = "statusCompleted";

            statusText = "COMPLETED";

        }else if(live){

            statusClass = "statusLive";

            statusText = "● LIVE";

        }


        const initials = name
            .trim()
            .split(/\s+/)
            .slice(0,2)
            .map(x=>x[0])
            .join("")
            .toUpperCase();


        const last = getLastAttendance(student);

        let lastText = "No class yet";

        if(last){

            const t = getTimeValue(last);

            if(t){

                lastText =
                    new Date(t).toLocaleDateString(
                        "en-IN",
                        {
                            day:"2-digit",
                            month:"short"
                        }
                    );

            }

        }


        return `

        <article class="studentCard ${live ? "live":""} ${done ? "completed":""}">

            <div class="studentHeader">

                <div class="avatar">
                    ${escapeHTML(initials || "A")}
                </div>

                <div class="studentInfo">

                    <div class="studentName">
                        ${escapeHTML(name)}
                    </div>

                    <div class="studentPhone">
                        ${escapeHTML(phone || "No phone")}
                    </div>

                </div>

                <div class="statusPill ${statusClass}">
                    ${statusText}
                </div>

            </div>


            <div class="typeRow">

                <div class="typeBadge ${
                    type === "Personal"
                    ? "typePersonal"
                    : "typeGroup"
                }">

                    ${type === "Personal"
                        ? "PERSONAL"
                        : "GROUP"}

                </div>

                ${
                    live
                    ? `<div class="typeBadge" style="color:#73e8b8">
                        LIVE SESSION
                       </div>`
                    : ""
                }

            </div>


            <div class="progressSection">

                <div class="progressTop">

                    <span>Training Progress</span>

                    <span>
                        ${completed}/${total} classes
                    </span>

                </div>

                <div class="progressBar">

                    <div
                        class="progressFill"
                        style="width:${percent}%">
                    </div>

                </div>

            </div>


            <div class="infoGrid">

                <div class="infoItem">

                    <div class="label">COMPLETED</div>

                    <div class="value">
                        ${completed}
                    </div>

                </div>

                <div class="infoItem">

                    <div class="label">REMAINING</div>

                    <div class="value">
                        ${remaining}
                    </div>

                </div>

                <div class="infoItem">

                    <div class="label">LAST CLASS</div>

                    <div class="value">
                        ${lastText}
                    </div>

                </div>

            </div>


            <div class="actionGrid">

                ${
                    !done && !inactive
                    ? `
                    <button
                        class="actionBtn actionPrimary"
                        onclick="openAttendance('${student.id}')">
                        + Attendance
                    </button>
                    `
                    :
                    `
                    <button
                        class="actionBtn actionPrimary"
                        onclick="openHistory('${student.id}')">
                        History
                    </button>
                    `
                }


                <button
                    class="actionBtn actionBlue"
                    onclick="openHistory('${student.id}')">
                    History
                </button>


                <button
                    class="actionBtn"
                    onclick="editStudent('${student.id}')">
                    Edit
                </button>

            </div>


            <div class="actionGrid" style="margin-top:8px">

                <button
                    class="actionBtn actionGreen"
                    onclick="whatsappStudent('${student.id}')">
                    WhatsApp
                </button>

                <button
                    class="actionBtn"
                    onclick="callStudent('${student.id}')">
                    Call
                </button>

                ${
                    inactive
                    ?
                    `<button
                        class="actionBtn actionGreen"
                        onclick="toggleActive('${student.id}',true)">
                        Activate
                    </button>`
                    :
                    `<button
                        class="actionBtn actionRed"
                        onclick="toggleActive('${student.id}',false)">
                        Deactivate
                    </button>`
                }

            </div>

        </article>

        `;

    }).join("");

};

/* ============================================================
   SAVE STUDENT
============================================================ */

window.saveStudent = async function(){

    const name =
        document.getElementById("studentName").value.trim();

    const phone =
        document.getElementById("studentPhone").value.trim();

    const totalClasses =
        Number(document.getElementById("totalClasses").value || 20);

    const payment =
        Number(document.getElementById("paymentAmount").value || 0);

    const editId =
        document.getElementById("editStudentId").value;


    if(!name){

        toast("Enter student name");

        return;

    }


    if(!phone){

        toast("Enter phone number");

        return;

    }


    try{

        if(editId){

            const student =
                students.find(s=>s.id === editId);

            const updateData = {

                name,

                phone,

                totalClasses,

                classType:selectedClassType,

                updatedAt:serverTimestamp()

            };


            /*
               If a new payment is entered while editing,
               append it into paymentLogs.
            */

            if(payment > 0){

                const oldLogs =
                    getPaymentArray(student || {});

                updateData.paymentLogs = [

                    ...oldLogs,

                    {

                        amount:payment,

                        classType:selectedClassType,

                        date:new Date().toISOString()

                    }

                ];

            }


            await updateDoc(
                doc(db,"studentData",editId),
                updateData
            );


            toast("Student updated");

        }else{

            const data = {

                name,

                phone,

                totalClasses,

                classType:selectedClassType,

                active:true,

                attendanceLogs:[],

                createdAt:serverTimestamp(),

                updatedAt:serverTimestamp()

            };


            if(payment > 0){

                data.paymentLogs = [

                    {

                        amount:payment,

                        classType:selectedClassType,

                        date:new Date().toISOString()

                    }

                ];

            }


            await addDoc(
                studentsRef,
                data
            );


            toast("Student added");

        }


        closeModal("studentModal");

    }catch(error){

        console.error(error);

        toast("Save failed");

    }

};

   EDIT STUDENT

window.editStudent = function(id){

        this.value === "Custom Remark"
        ? "block"

/* ============================================================
   MARK ATTENDANCE
============================================================ */

window.markAttendance = async function(){

    const id =
        document.getElementById("attendanceStudentId").value;

    const student =
        students.find(s=>s.id === id);

    if(!student)
        return;


    const route =
        document.getElementById("route").value;

    let remark =
        document.getElementById("remark").value;


    if(remark === "Custom Remark"){

        remark =
            document.getElementById("customRemark")
            .value
            .trim();

        if(!remark)
            remark = "Driving Session";

    }


    const oldLogs =
        getAttendanceLogs(student);


    const newLog = {

        route,

        distance:5,

        remark,

        classType:getClassType(student),

        timestamp:new Date().toISOString(),

        date:new Date().toISOString()

    };


    const logs = [

        ...oldLogs,

        newLog

    ];


    try{

        await updateDoc(
            doc(db,"studentData",id),
            {

                attendanceLogs:logs,

                remaining:Math.max(
                    0,
                    getTotalClasses(student) - logs.length
                ),

                completedClasses:logs.length,

                updatedAt:serverTimestamp()

            }
        );


        closeModal("attendanceModal");

        toast("Attendance marked");

    }catch(error){

        console.error(error);

        toast("Attendance failed");

    }

};


/* ============================================================
   HISTORY
============================================================ */

window.openHistory = function(id){

    const student =
        students.find(s=>s.id === id);

    if(!student)
        return;


    const logs =
        [...getAttendanceLogs(student)]
        .sort((a,b)=>getTimeValue(b)-getTimeValue(a));


    document.getElementById("historyStudentName").textContent =
        getName(student);


    const list =
        document.getElementById("historyList");


    if(!logs.length){

        list.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">📋</div>

                <h3>No attendance yet</h3>

                <p>No class history available.</p>

            </div>

        `;

    }else{

        list.innerHTML = logs.map((log,index)=>{

            const time =
                getTimeValue(log);

            const date =
                time
                ? new Date(time)
                    .toLocaleString(
                        "en-IN",
                        {
                            day:"2-digit",
                            month:"short",
                            year:"numeric",
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    )
                : "Date unavailable";


            return `

            <div class="historyItem">

                <div class="historyTop">

                    <div class="historyRoute">
                        #${logs.length-index}
                        ${escapeHTML(log.route || "Route")}
                    </div>

                    <div class="historyDate">
                        ${date}
                    </div>

                </div>

                <div class="historyBottom">

                    <span>
                        ${escapeHTML(log.remark || "Driving Session")}
                    </span>

                    <span>
                        ${Number(log.distance || 5)} KM
                    </span>

                </div>

            </div>

            `;

        }).join("");

    }


    openModal("historyModal");

};


/* ============================================================
   ACTIVE / INACTIVE
============================================================ */

window.toggleActive = async function(id,value){

    try{

        await updateDoc(
            doc(db,"studentData",id),
            {

                active:value,

                status:value
                    ? "active"
                    : "inactive",

                updatedAt:serverTimestamp()

            }
        );


        toast(
            value
            ? "Student activated"
            : "Student marked inactive"
        );

    }catch(error){

        console.error(error);

        toast("Update failed");

    }

};


/* ============================================================
   WHATSAPP
============================================================ */

window.whatsappStudent = function(id){

    const student =
        students.find(s=>s.id === id);

    if(!student)
        return;


    let phone =
        getPhone(student)
        .replace(/\D/g,"");


    if(phone.length === 10)
        phone = "91" + phone;


    if(!phone){

        toast("Phone number not available");

        return;

    }


    const completed =
        getCompletedClasses(student);

    const total =
        getTotalClasses(student);

    const remaining =
        getRemainingClasses(student);


    const message =
`Hello ${getName(student)} 👋

A1 Driving Classes

Training Progress:
Completed: ${completed}/${total}
Remaining: ${remaining}

Class Type: ${getClassType(student)}

Thank you.
A1 Driving Classes 🚗`;


    window.open(
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message),
        "_blank"
    );

};


/* ============================================================
   CALL
============================================================ */

window.callStudent = function(id){

    const student =
        students.find(s=>s.id === id);

    if(!student)
        return;


    const phone =
        getPhone(student);


    if(!phone){

        toast("Phone number not available");

        return;

    }


    window.location.href =
        "tel:" + phone;

};


/* ============================================================
   MODALS
============================================================ */

function openModal(id){

    document.getElementById(id)
        .classList.add("show");

}


window.closeModal = function(id){

    document.getElementById(id)
        .classList.remove("show");

};


document.querySelectorAll(".modal")
.forEach(modal=>{

    modal.addEventListener("click",function(e){

        if(e.target === modal)
            modal.classList.remove("show");

    });

});


/* ============================================================
   TOAST
============================================================ */

function toast(message){

    const el =
        document.getElementById("toast");

    el.textContent = message;

    el.classList.add("show");


    clearTimeout(window.__toastTimer);


    window.__toastTimer =
        setTimeout(()=>{

            el.classList.remove("show");

        },2200);

}


/* ============================================================
   EXPOSE
============================================================ */

window.loadStudents = loadStudents;


/* ============================================================
   START
============================================================ */

startRealtime();

loadStudents();


/* Refresh live status */
setInterval(()=>{

    updateStats();

    renderStudents();

},30000);

</script>
