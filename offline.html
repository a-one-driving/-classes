
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Offline | A One Driving Classes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 30px 22px;
      background: #101010;
      border: 1px solid #d4af37;
      border-radius: 22px;
    }

    .car {
      font-size: 55px;
    }

    h1 {
      color: #d4af37;
      font-size: 24px;
    }

    p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.7;
    }

    button {
      margin-top: 12px;
      padding: 13px 22px;
      border: none;
      border-radius: 10px;
      background: #d4af37;
      color: #050505;
      font-weight: bold;
      cursor: pointer;
    }

    a {
      display: block;
      margin-top: 18px;
      color: #f4d675;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="car">🚗</div>

    <h1>You Are Offline</h1>

    <p>
      A One Driving Classes needs an internet connection
      to load live student profiles, attendance and booking.
      Please reconnect and try again.
    </p>

    <button onclick="location.reload()">
      TRY AGAIN
    </button>

    <a href="/">Back to Home</a>
  </main>
</body>
</html>
